services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: streamingdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8085:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: streamingdb
      DB_USER: postgres
      DB_PASS: postgres
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ../../StramingSong-Frontend
      dockerfile: Dockerfile
    ports:
      - "3001:80"
    depends_on:
      - app

volumes:
  postgres_data:
